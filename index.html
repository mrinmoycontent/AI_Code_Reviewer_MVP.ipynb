<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Code Reviewer & Auto-Fixer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #1e293b;
    }

    .container {
      max-width: 1050px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .header p {
      color: #64748b;
      font-size: 17px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    select {
      margin-bottom: 20px;
      background: white;
    }

    textarea {
      min-height: 330px;
      font-family: monospace;
      resize: vertical;
      line-height: 1.5;
    }

    select:focus,
    textarea:focus {
      border-color: #6366f1;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .fix {
      background: #16a34a;
      color: white;
    }

    .clear {
      background: #64748b;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      margin-top: 20px;
      font-weight: bold;
    }

    #result {
      display: none;
      white-space: pre-wrap;
      line-height: 1.7;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px auto;
      }

      .header h1 {
        font-size: 30px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🤖 AI Code Reviewer & Auto-Fixer</h1>
    <p>Generate an AI-powered fix for your code.</p>
  </div>

  <div class="card">

    <label for="language">Programming Language</label>

    <select id="language">
      <option>Python</option>
      <option>JavaScript</option>
      <option>Java</option>
      <option>C#</option>
      <option>C++</option>
      <option>SQL</option>
    </select>

    <label for="code">Your Code</label>

    <textarea
      id="code"
      placeholder="Paste your code here..."
    ></textarea>

    <div class="buttons">

      <button
        id="fixButton"
        class="fix"
        onclick="generateFix()">
        🛠️ Generate Fix
      </button>

      <button
        id="clearButton"
        class="clear"
        onclick="clearAll()">
        🗑️ Clear
      </button>

    </div>

    <div class="loading" id="loading">
      🛠️ AI is generating a fix...
    </div>

    <div class="success" id="successMessage">
      ✅ Fixed code has been applied to the editor.
    </div>

  </div>

  <div class="card">

    <h2>📋 AI Fix Result</h2>

    <div id="result">
      Your AI fix will appear here.
    </div>

  </div>

  <div class="footer">
    AI Code Reviewer & Auto-Fixer • Portfolio Project
  </div>

</div>

<script>

let fixCooldown = false;
let fixCooldownTimer = null;


/* =========================================================
   GENERATE FIX
   ========================================================= */

async function generateFix() {

  if (fixCooldown) {
    return;
  }

  const code =
    document.getElementById("code").value.trim();

  const language =
    document.getElementById("language").value;

  const loading =
    document.getElementById("loading");

  const result =
    document.getElementById("result");

  const fixButton =
    document.getElementById("fixButton");

  const clearButton =
    document.getElementById("clearButton");

  if (!code) {

    alert("Please enter some code.");

    return;
  }

  loading.textContent =
    "🛠️ AI is generating a fix...";

  loading.style.display =
    "block";

  result.style.display =
    "none";

  setButtonsDisabled(true);

  try {

    const response =
      await fetch("/api/fix", {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          code: code,
          language: language
        })

      });


    const responseText =
      await response.text();


    let data;

    try {

      data =
        JSON.parse(responseText);

    } catch {

      data = {
        error: responseText
      };

    }


    if (!response.ok) {

      if (response.status === 429) {

        result.textContent =
          "⚠️ AI service is temporarily busy.\n\n" +
          "Please wait 30 seconds before trying again.";

      } else {

        result.textContent =
          "❌ " +
          (
            data?.error ||
            data?.message ||
            `Fix generation failed (${response.status}).`
          );

      }

      result.style.display =
        "block";

      return;
    }


    const aiResult =
      data?.result?.trim();


    if (!aiResult) {

      result.textContent =
        "❌ No result was returned by the AI service.";

      result.style.display =
        "block";

      return;
    }


    result.textContent =
      aiResult;

    result.style.display =
      "block";


  } catch (error) {

    console.error(
      "Generate Fix error:",
      error
    );

    result.textContent =
      "❌ AI fix service is temporarily unavailable. " +
      "Please try again shortly.";

    result.style.display =
      "block";

  } finally {

    loading.style.display =
      "none";

    setButtonsDisabled(false);

    startFixCooldown();

  }
}


/* =========================================================
   30 SECOND PROTECTION AGAINST BACK-TO-BACK REQUESTS
   ========================================================= */

function startFixCooldown() {

  fixCooldown =
    true;

  let seconds =
    30;

  const fixButton =
    document.getElementById("fixButton");

  fixButton.disabled =
    true;

  fixButton.textContent =
    `⏳ Wait ${seconds}s...`;


  if (fixCooldownTimer) {

    clearInterval(
      fixCooldownTimer
    );

  }


  fixCooldownTimer =
    setInterval(() => {

      seconds--;


      if (seconds <= 0) {

        clearInterval(
          fixCooldownTimer
        );

        fixCooldownTimer =
          null;

        fixCooldown =
          false;

        fixButton.disabled =
          false;

        fixButton.textContent =
          "🛠️ Generate Fix";

        return;
      }


      fixButton.textContent =
        `⏳ Wait ${seconds}s...`;

    }, 1000);

}


/* =========================================================
   BUTTON CONTROL
   ========================================================= */

function setButtonsDisabled(disabled) {

  document.getElementById(
    "fixButton"
  ).disabled =
    disabled || fixCooldown;


  document.getElementById(
    "clearButton"
  ).disabled =
    disabled;

}


/* =========================================================
   CLEAR
   ========================================================= */

function clearAll() {

  document.getElementById(
    "code"
  ).value =
    "";

  document.getElementById(
    "result"
  ).textContent =
    "Your AI fix will appear here.";

  document.getElementById(
    "result"
  ).style.display =
    "none";

  document.getElementById(
    "loading"
  ).style.display =
    "none";

  document.getElementById(
    "successMessage"
  ).style.display =
    "none";

}

</script>

</body>
</html>
