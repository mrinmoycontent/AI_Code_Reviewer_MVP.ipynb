<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Code Reviewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7fb;
      color: #172033;
    }

    .header {
      background: #111827;
      color: white;
      padding: 24px;
      text-align: center;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: 30px;
    }

    .header p {
      margin: 0;
      color: #cbd5e1;
    }

    .container {
      width: min(1100px, 94%);
      margin: 30px auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 8px 30px rgba(15, 23, 42, 0.08);
    }

    label {
      display: block;
      font-weight: 700;
      margin-bottom: 8px;
    }

    select,
    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      padding: 12px;
      font-size: 15px;
      outline: none;
    }

    select:focus,
    textarea:focus {
      border-color: #6366f1;
    }

    select {
      margin-bottom: 20px;
      background: white;
    }

    textarea {
      min-height: 300px;
      resize: vertical;
      font-family: Consolas, Monaco, monospace;
      line-height: 1.5;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .review {
      background: #2563eb;
      color: white;
    }

    .fix {
      background: #16a34a;
      color: white;
    }

    .run {
      background: #7c3aed;
      color: white;
    }

    .clear {
      background: #e5e7eb;
      color: #111827;
    }

    #status {
      margin-top: 18px;
      font-weight: 600;
      white-space: pre-wrap;
    }

    #result {
      margin-top: 20px;
      background: #0f172a;
      color: #e2e8f0;
      border-radius: 12px;
      padding: 20px;
      min-height: 120px;
      white-space: pre-wrap;
      overflow-x: auto;
      font-family: Consolas, Monaco, monospace;
      line-height: 1.55;
    }

    .result-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>AI Code Reviewer</h1>
    <p>Review, fix and validate your code with AI</p>
  </header>

  <main class="container">

    <section class="card">

      <label for="language">Programming Language</label>

      <select id="language">
        <option value="Python">Python</option>
        <option value="JavaScript">JavaScript</option>
        <option value="Java">Java</option>
        <option value="C#">C#</option>
        <option value="C++">C++</option>
        <option value="SQL">SQL</option>
      </select>

      <label for="code">Your Code</label>

      <textarea
        id="code"
        placeholder="Paste your code here..."
      ></textarea>

      <div class="buttons">

        <button
          id="reviewBtn"
          class="review"
          onclick="reviewCode()"
        >
          Review Code
        </button>

        <button
          id="fixBtn"
          class="fix"
          onclick="fixCode()"
        >
          Generate Fix
        </button>

        <button
          id="runBtn"
          class="run"
          onclick="testCode()"
        >
          Test Code
        </button>

        <button
          class="clear"
          onclick="clearAll()"
        >
          Clear
        </button>

      </div>

      <div id="status"></div>

    </section>

    <section class="card">

      <div class="result-title">
        Result
      </div>

      <div id="result">
        Your AI result will appear here.
      </div>

    </section>

  </main>

  <footer class="footer">
    AI Code Reviewer MVP
  </footer>

  <script>

    const codeInput = document.getElementById("code");
    const languageInput = document.getElementById("language");

    const reviewBtn = document.getElementById("reviewBtn");
    const fixBtn = document.getElementById("fixBtn");
    const runBtn = document.getElementById("runBtn");

    const statusBox = document.getElementById("status");
    const resultBox = document.getElementById("result");

    let fixCooldown = false;
    let fixCooldownTimer = null;

    function setLoading(loading, message = "") {

      reviewBtn.disabled = loading;
      runBtn.disabled = loading;

      /*
        Do not overwrite the Generate Fix button
        during its 30-second cooldown.
      */
      if (!fixCooldown) {
        fixBtn.disabled = loading;
      }

      statusBox.textContent = message;
    }

    function getInput() {

      const code = codeInput.value.trim();
      const language = languageInput.value;

      if (!code) {
        throw new Error("Please enter some code first.");
      }

      return {
        code,
        language
      };
    }

    async function callAPI(endpoint) {

      const input = getInput();

      const response = await fetch(endpoint, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(input)
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error(
          `Server returned an invalid response (${response.status}).`
        );
      }

      if (!response.ok) {

        if (response.status === 429) {
          throw new Error(
            "Too many requests. Please wait 30 seconds before trying again."
          );
        }

        throw new Error(
          data?.error ||
          data?.message ||
          `Request failed with HTTP ${response.status}.`
        );
      }

      return data;
    }

    async function reviewCode() {

      try {

        setLoading(true, "Reviewing your code...");

        resultBox.textContent = "";

        const data = await callAPI("/api/review");

        resultBox.textContent =
          data.result ||
          data.message ||
          data.error ||
          "No result returned.";

        setLoading(false, "Review completed.");

      } catch (error) {

        setLoading(false);

        resultBox.textContent =
          "❌ " + error.message;

        statusBox.textContent =
          "Review failed.";
      }
    }

    async function fixCode() {

      if (fixCooldown) {
        return;
      }

      try {

        setLoading(true, "Generating fix...");

        resultBox.textContent = "";

        const data = await callAPI("/api/fix");

        resultBox.textContent =
          data.result ||
          data.message ||
          data.error ||
          "No result returned.";

        setLoading(false, "Fix generated successfully.");

        startFixCooldown();

      } catch (error) {

        setLoading(false);

        resultBox.textContent =
          "❌ " + error.message;

        statusBox.textContent =
          "Please wait before trying again.";

        startFixCooldown();
      }
    }

    function startFixCooldown() {

      fixCooldown = true;

      let seconds = 30;

      fixBtn.disabled = true;
      fixBtn.textContent = `Wait ${seconds}s...`;

      if (fixCooldownTimer) {
        clearInterval(fixCooldownTimer);
      }

      fixCooldownTimer = setInterval(() => {

        seconds--;

        if (seconds <= 0) {

          clearInterval(fixCooldownTimer);

          fixCooldownTimer = null;
          fixCooldown = false;

          fixBtn.disabled = false;
          fixBtn.textContent = "Generate Fix";

          statusBox.textContent = "";

          return;
        }

        fixBtn.textContent = `Wait ${seconds}s...`;

      }, 1000);
    }

    async function testCode() {

      try {

        setLoading(true, "Testing code...");

        resultBox.textContent = "";

        const data = await callAPI("/api/run");

        resultBox.textContent =
          data.result ||
          data.message ||
          data.error ||
          "Code received successfully.";

        setLoading(false, "Test completed.");

      } catch (error) {

        setLoading(false);

        resultBox.textContent =
          "❌ " + error.message;

        statusBox.textContent =
          "Test failed.";
      }
    }

    function clearAll() {

      codeInput.value = "";

      resultBox.textContent =
        "Your AI result will appear here.";

      statusBox.textContent = "";
    }

    codeInput.addEventListener("keydown", function(event) {

      if (
        (event.ctrlKey || event.metaKey) &&
        event.key === "Enter"
      ) {

        event.preventDefault();

        fixCode();
      }

    });

  </script>

</body>
</html>
