<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AI Code Reviewer & Auto-Fixer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #1e293b;
    }

    .container {
      max-width: 1050px;
      margin: 40px auto;
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
    }

    .header h1 {
      font-size: 40px;
      margin-bottom: 10px;
    }

    .header p {
      color: #64748b;
      font-size: 17px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    select,
    textarea {
      width: 100%;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    select {
      margin-bottom: 20px;
      background: white;
    }

    textarea {
      min-height: 330px;
      font-family: monospace;
      resize: vertical;
      line-height: 1.5;
    }

    select:focus,
    textarea:focus {
      border-color: #6366f1;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    button {
      border: none;
      padding: 14px 22px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .review {
      background: #4f46e5;
      color: white;
    }

    .fix {
      background: #16a34a;
      color: white;
    }

    .apply {
      background: #f59e0b;
      color: white;
      display: none;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .loading {
      display: none;
      margin-top: 20px;
      font-weight: bold;
    }

    #result {
      display: none;
      white-space: pre-wrap;
      line-height: 1.7;
      font-family: Arial, sans-serif;
    }

    .success {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #dcfce7;
      color: #166534;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      margin-top: 30px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 15px auto;
      }

      .header h1 {
        font-size: 30px;
      }

      .buttons {
        flex-direction: column;
      }

      button {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>🤖 AI Code Reviewer & Auto-Fixer</h1>
    <p>Review, analyze, fix and improve your code with AI.</p>
  </div>

  <div class="card">

    <label for="language">Programming Language</label>

    <select id="language">
      <option>Python</option>
      <option>JavaScript</option>
      <option>Java</option>
      <option>C#</option>
      <option>C++</option>
      <option>SQL</option>
    </select>

    <label for="code">Your Code</label>

    <textarea id="code">def calculate_discount(price, discount):
    final_price = price - (price * discount)
    return final_price

price = "100"
discount = 20

print(calculate_discount(price, discount))</textarea>

    <div class="buttons">

      <button
        id="reviewButton"
        class="review"
        onclick="reviewCode()">
        🔍 Review Code
      </button>

      <button
        id="fixButton"
        class="fix"
        onclick="generateFix()">
        🛠️ Generate Fix
      </button>

      <button
        id="applyButton"
        class="apply"
        onclick="applyFix()">
        ✅ Apply Fix
      </button>

    </div>

    <div class="loading" id="loading">
      🔍 AI is working...
    </div>

    <div class="success" id="successMessage">
      ✅ Fixed code has been applied to the editor.
    </div>

  </div>

  <div class="card">

    <h2>📋 AI Review</h2>

    <div id="result">
      Your AI result will appear here.
    </div>

  </div>

  <div class="footer">
    AI Code Reviewer & Auto-Fixer • Portfolio Project
  </div>

</div>


<script>

let latestFixedCode = "";


/* =========================
   REVIEW CODE
========================= */

async function reviewCode() {

  const code = document.getElementById("code").value.trim();
  const language = document.getElementById("language").value;

  if (!code) {
    alert("Please enter some code.");
    return;
  }

  const loading = document.getElementById("loading");
  const result = document.getElementById("result");

  loading.textContent = "🔍 AI is reviewing your code...";
  loading.style.display = "block";

  result.style.display = "none";

  document.getElementById("applyButton").style.display = "none";

  setButtonsDisabled(true);

  try {

    const response = await fetch("/api/review", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        code: code,
        language: language
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Review failed.");
    }

    result.textContent = data.result;
    result.style.display = "block";

  } catch (error) {

    result.textContent = "❌ " + error.message;
    result.style.display = "block";

  } finally {

    loading.style.display = "none";
    setButtonsDisabled(false);

  }
}


/* =========================
   GENERATE FIX
========================= */

async function generateFix() {

  const code = document.getElementById("code").value.trim();
  const language = document.getElementById("language").value;

  if (!code) {
    alert("Please enter some code.");
    return;
  }

  const loading = document.getElementById("loading");
  const result = document.getElementById("result");
  const success = document.getElementById("successMessage");

  loading.textContent = "🛠️ AI is generating a fix...";
  loading.style.display = "block";

  result.style.display = "none";
  success.style.display = "none";

  document.getElementById("applyButton").style.display = "none";

  setButtonsDisabled(true);

  try {

    const response = await fetch("/api/fix", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        code: code,
        language: language
      })

    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Fix generation failed.");
    }

    result.textContent = data.result;
    result.style.display = "block";

    latestFixedCode = extractFixedCode(data.result);

    if (latestFixedCode) {
      document.getElementById("applyButton").style.display = "inline-block";
    }

  } catch (error) {

    result.textContent = "❌ " + error.message;
    result.style.display = "block";

  } finally {

    loading.style.display = "none";
    setButtonsDisabled(false);

  }
}


/* =========================
   EXTRACT FIXED CODE
========================= */

function extractFixedCode(text) {

  const match = text.match(
    /FIXED CODE:\s*```(?:python|javascript|java|csharp|cpp|sql)?\s*([\s\S]*?)```/i
  );

  if (match) {
    return match[1].trim();
  }

  return "";
}


/* =========================
   APPLY FIX
========================= */

function applyFix() {

  if (!latestFixedCode) {
    alert("No corrected code is available.");
    return;
  }

  document.getElementById("code").value = latestFixedCode;

  document.getElementById("successMessage").style.display = "block";

  document.getElementById("applyButton").style.display = "none";

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}


/* =========================
   BUTTON CONTROL
========================= */

function setButtonsDisabled(disabled) {

  document.getElementById("reviewButton").disabled = disabled;

  document.getElementById("fixButton").disabled = disabled;

  document.getElementById("applyButton").disabled = disabled;

}

</script>

</body>
</html>
